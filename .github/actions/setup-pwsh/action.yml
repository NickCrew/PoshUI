name: Set up pinned PowerShell
description: Ensures at least the pinned PowerShell version is present, verified by SHA256 when an install is needed, on a Debian-based runner.
inputs:
  version:
    description: Minimum PowerShell version required (without a leading v)
    required: true
  sha256:
    description: SHA256 checksum of the linked .deb package, used only when an install is needed
    required: true
runs:
  using: composite
  steps:
    - name: Ensure PowerShell ${{ inputs.version }} or later
      shell: bash
      run: |
        set -eu
        installed=$(pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()' 2>/dev/null || true)
        if [ -n "$installed" ]; then
          highest=$(printf '%s\n%s\n' "$installed" "${{ inputs.version }}" | sort -V | tail -n1)
          if [ "$highest" = "$installed" ]; then
            echo "PowerShell $installed is already installed and satisfies the ${{ inputs.version }} minimum."
            exit 0
          fi
        fi

        sudo apt-get update -qq && sudo apt-get install -y -qq ca-certificates curl git >/dev/null
        curl --fail --location --silent --show-error --output /tmp/powershell.deb "https://github.com/PowerShell/PowerShell/releases/download/v${{ inputs.version }}/powershell_${{ inputs.version }}-1.deb_amd64.deb"
        echo "${{ inputs.sha256 }}  /tmp/powershell.deb" | sha256sum --check --status
        sudo apt-get install -y -qq --allow-downgrades /tmp/powershell.deb >/dev/null
        installed=$(pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()')
        highest=$(printf '%s\n%s\n' "$installed" "${{ inputs.version }}" | sort -V | tail -n1)
        if [ "$highest" != "$installed" ]; then
          echo "Expected at least PowerShell ${{ inputs.version }}, found $installed." >&2
          exit 1
        fi
